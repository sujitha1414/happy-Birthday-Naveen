<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Naveen ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ff6b81,#ff9ff3);
overflow-x:hidden;
text-align:center;
color:white;
}

.container{
padding:30px;
}

h1{
font-size:3rem;
margin-top:30px;
}

.btn{
margin-top:20px;
padding:15px 30px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
background:white;
color:#ff4d6d;
font-weight:bold;
}

.message{
display:none;
margin-top:30px;
padding:20px;
background:rgba(255,255,255,0.15);
border-radius:20px;
}

#countdown{
font-size:24px;
margin-top:20px;
}

.heart{
position:fixed;
bottom:-20px;
font-size:20px;
animation:float 6s linear infinite;
}

@keyframes float{
0%{
transform:translateY(0);
opacity:1;
}
100%{
transform:translateY(-100vh);
opacity:0;
}
}
</style>
</head>

<body>

<div class="container">

<h1>🎂 Happy Birthday Naveen ❤️</h1>

<p>A Special Surprise For A Very Special Friend ✨</p>

<div id="countdown"></div>

<button class="btn" onclick="showMessage()">
💌 Open Surprise
</button>

<div class="message" id="msg">

<h2>Dear Naveen ❤️</h2>

<p>
Nee en life-la vandha romba special person.
Namma friendship enaku eppovum precious. ✨
</p>

<p>
Un birthday-la nee ninaicha ellame nadakanum,
un smile eppovum ippadiye irukanum. ❤️
</p>

<p>
Happy Birthday Naveen 🎂✨
</p>

</div>

</div>

<script>
function showMessage(){
document.getElementById("msg").style.display="block";
}

const targetDate=new Date("August 2, 2026 00:00:00").getTime();

setInterval(()=>{
const now=new Date().getTime();
const distance=targetDate-now;

const days=Math.floor(distance/(1000*60*60*24));

document.getElementById("countdown").innerHTML=
"⏳ "+days+" Days Left";
},1000);

setInterval(()=>{
const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},6000);

},500);
</script>

</body>
</html>
